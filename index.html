*{box-sizing:border-box}

.top{

}

.logo{

.tag{

main{

.controls{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:24px

input,select{
  border:1px solid #d0d5dd;
  border-radius:12px;
  padding:13px 14px;
  font-size:15px;

input{

  min-width:220px
}

.grid{
  display:grid;

.card{
  background:var(--card);
  border-radius:18px;

  flex-direction:column

.content{

.category{

h2{

.desc{

.price{

.buy{

}

.buy:hover{

}

.empty{
  text-align:center;
  padding:50px;
  color:var(--muted)
}

footer{
  text-align:center;
  color:#667085;
  padding:40px 20px
}

@media(max-width:600px){
  .top{
    align-items:flex-start;
    flex-direction:column
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px
  }

  .card img{
    height:160px
  }

  .content{

  }

  h2{
    font-size:16px
  }

  .price{

  }
}

@media(max-width:380px){
  .grid{

  }
}
</style>

const money = n => n.toLocaleString(
  "pt-BR",
  {
    style:"currency",
    currency:"BRL"
  }
);


function render(){

  const q =
    document
    .querySelector("#search")
    .value
    .toLowerCase()
    .trim();

  const cat =
    document
    .querySelector("#category")
    .value;


  const list = products.filter(p =>

    (cat==="all" || p.category===cat)

    &&

    (
      `${p.name} ${p.description} ${p.category}`
      .toLowerCase()
      .includes(q)
    )

  );


  const box =
    document.querySelector("#products");

  const empty =
    document.querySelector("#empty");


  box.innerHTML="";

  empty.hidden =
    list.length > 0;


  list.forEach(p => {

    const msg =
      encodeURIComponent(
        `Olá! Tenho interesse no produto "${p.name}" no valor de ${money(p.price)}.`
      );


    box.insertAdjacentHTML(
      "beforeend",

      `

      <article class="card">

        <img
          src="${p.image}"
          alt="${p.name}"
          loading="lazy"
        >

        <div class="content">

          <div class="category">
            ${p.category}
          </div>

          <h2>
            ${p.name}
          </h2>

          <div class="desc">
            ${p.description}
          </div>

          <div class="price">
            ${money(p.price)}
          </div>

          <a
            class="buy"
            target="_blank"
            rel="noopener"
            href="https://wa.me/${WHATSAPP}?text=${msg}"
          >
            Comprar pelo WhatsApp
          </a>

        </div>

      </article>

      `
    );

  });

}


const cats =
  [
    ...new Set(
      products.map(p => p.category)
    )
  ];


cats.forEach(c => {

  document
  .querySelector("#category")
  .insertAdjacentHTML(
    "beforeend",
    `<option value="${c}">${c}</option>`
  );

});


document
.querySelector("#search")
.addEventListener(
  "input",
  render
);


document
.querySelector("#category")
.addEventListener(
  "change",
  render
);


render();

</script>
